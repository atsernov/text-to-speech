# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name kolaro.itcollege.ee;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name kolaro.itcollege.ee;

    # Let's Encrypt certificates
    ssl_certificate     /etc/letsencrypt/live/kolaro.itcollege.ee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolaro.itcollege.ee/privkey.pem;

    # Modern TLS settings (TLSv1.2 minimum, TLSv1.3 preferred)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tell browsers to always use HTTPS for the next year
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /app/public;
    index index.php;

    # Allow uploading files up to 500MB (large PDFs, scanned books)
    client_max_body_size 500M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # All requests go through Laravel (SPA / Inertia)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP files to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    # Deny access to hidden files (.env, .git etc.)
    location ~ /\. {
        deny all;
    }
}
